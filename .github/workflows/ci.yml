name: CI

on:
  push:
    branches: [main]
  pull_request:

# Every uv command in the run, not only the install: `uv run` inside the make targets
# would otherwise re-resolve and rewrite a lockfile that has drifted from pyproject.toml,
# and CI must test what the lockfile describes. An environment variable rather than a
# flag because `--frozen` belongs to the subcommand -- spliced into `$(UV)` it landed in
# front of `sync` and uv refused the whole command, which failed every run from the start.
env:
  UV_FROZEN: "1"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install API
        run: make api-install

      - name: Check version consistency
        run: make version-check

      - name: Lint markdown
        run: make lint-md

      - name: Lint and type-check
        run: make api-lint

      - name: Test
        run: make test

      - name: Extension manifest is valid JSON and matches the release version
        run: |
          node -e "
            const fs = require('fs');
            const manifest = JSON.parse(fs.readFileSync('apps/extension/src/manifest.json'));
            const pkg = JSON.parse(fs.readFileSync('package.json'));
            const core = pkg.version.split(/[-+]/)[0];
            if (manifest.version !== core) {
              throw new Error(\`manifest \${manifest.version} != release \${core}\`);
            }
            if (manifest.manifest_version !== 3) throw new Error('expected MV3');
          "

      - name: OpenAPI contract is up to date
        run: make openapi-check

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Revision 0002 needs pgvector, which the stock postgres image does not ship.
        # pg18 because that is what the real database runs.
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: page_history_test
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Install API
        run: make api-install

      # The same file `make db-bootstrap` applies. Here the connecting role is the
      # superuser, so this is the step a real deployment does by hand as postgres.
      - name: Install pgvector
        env:
          PGPASSWORD: postgres
        run: >-
          psql -h localhost -U postgres -d page_history_test
          -v ON_ERROR_STOP=1 -f db/schema/bootstrap.sql

      - name: Postgres suite
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/page_history_test
        run: make test-pg
