[alembic]
script_location = migrations

# No prepend_sys_path: bookmarks_api is installed (editable) in the environment alembic
# runs in, so env.py imports it the same way the app does. A path here would be resolved
# against the working directory and break the moment you ran alembic from elsewhere.
version_path_separator = os

# Revision ids are sequential and zero-padded (0001, 0002, ...) rather than random
# hashes, so that migration order is readable in a directory listing and in review.
file_template = %%(rev)s_%%(slug)s

# sqlalchemy.url is not set here. It comes from the application settings via env.py,
# so there is exactly one place the database credentials live.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
