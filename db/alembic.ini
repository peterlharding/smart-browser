[alembic]
# %(here)s is the directory holding this file. A bare `migrations` is resolved against
# the *working directory*, so it only worked while alembic happened to be run from db/ --
# the same cwd-relative trap that hid the .env from the settings.
script_location = %(here)s/migrations

# The revisions import sqlrunner.py, which lives beside them. Alembic applies this when
# it loads the script directory, so `alembic history` and every tool that merely *reads*
# the revisions work too -- env.py runs too late for that. Anchored with %(here)s, never
# a bare path: see script_location above. bookmarks_api is not here; it is installed
# (editable) in the environment alembic runs in, and env.py imports it as the app does.
prepend_sys_path = %(here)s/migrations

# path_separator governs how alembic splits prepend_sys_path and version_locations. Not
# setting it warns and falls back to splitting on spaces, commas *and colons* -- which
# would quietly cut an absolute path in two on any platform where a path can contain one.
path_separator = os

version_path_separator = os

# Revision ids are sequential and zero-padded (0001, 0002, ...) rather than random
# hashes, so that migration order is readable in a directory listing and in review.
file_template = %%(rev)s_%%(slug)s

# sqlalchemy.url is not set here. It comes from the application settings via env.py,
# so there is exactly one place the database credentials live.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
