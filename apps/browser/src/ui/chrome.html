<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- The browser's own UI loads the app's files and nothing else: no network (ADR 0015). -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'" />
    <title>Smart-Browser</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./chrome.ts"></script>
  </body>
</html>
