[project]
name = "bookmarks-api"
version = "0.5.0"
description = "Smart-Browser bookmarks API (v2)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "alembic>=1.13",
    "tldextract>=5.3",   # top_domain_under_public_suffix; registered_domain deprecated
    "pgvector>=0.5.0",
    "trafilatura>=2.0",
    "fastembed>=0.7",
]

# PEP 735 dependency group rather than an optional extra: these are development tools,
# not a published feature of the package, and `uv sync` installs the dev group by default
# where an extra would need `--extra dev` every time.
[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    # starlette's TestClient deprecates httpx 0.x; httpx2 silences the warning.
    "httpx2>=2.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bookmarks_api"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# The default run excludes the Postgres suite and the real embedding model, so `pytest`
# needs no infrastructure and no download.
# Opt in with:  TEST_DATABASE_URL=... pytest -m postgres     or     pytest -m model
addopts = "-m 'not postgres and not model'"
# The release checklist requires a run with no warnings, so warnings are errors and the
# handful we do not control are listed explicitly. A new deprecation in our own code
# fails the suite rather than scrolling past; a new one here is a deliberate decision.
filterwarnings = [
    "error",
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:",
    # tld (under trafilatura, via courlan) loads its suffix list with codecs.open(),
    # deprecated in Python 3.14. As an error it is worse than noisy: tld swallows the
    # exception, returns None, and fails later with a TypeError far from the cause.
    "ignore:codecs.open\\(\\) is deprecated:DeprecationWarning:tld.utils",
]
markers = [
    "postgres: requires a real Postgres via TEST_DATABASE_URL",
    "model: runs the real embedding model, downloading it once (64 MB) into EMBEDDING_CACHE_DIR",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
